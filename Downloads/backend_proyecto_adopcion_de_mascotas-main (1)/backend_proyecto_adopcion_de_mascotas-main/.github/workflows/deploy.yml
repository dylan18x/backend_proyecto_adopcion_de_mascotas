name: 🚀 Deploy NestJS Pet Adoption API

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Copy project to VPS
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        key: ${{ secrets.VPS_KEY }}
        source: "."
        target: "/home/dylanfer/backend_proyecto_adopcion_de_mascotas"

    - name: Run deploy commands on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        key: ${{ secrets.VPS_KEY }}
        script: |
          set -e
          cd /home/dylanfer/backend_proyecto_adopcion_de_mascotas
          
          # Matar proceso previo en puerto 3000 si existe
          sudo lsof -t -i:3000 | xargs -r sudo kill -9 || true

          # Escribir el archivo .env desde los secrets (Paso 8.1)
          printf "%s" "${{ secrets.ENV_FILE }}" > .env

          # Instalar y construir (Paso 8.2)
          npm install
          npm run build

          # Reiniciar PM2 (Paso 8.3)
          pm2 delete api-mascotas || true
          pm2 start dist/main.js --name api-mascotas
          pm2 save